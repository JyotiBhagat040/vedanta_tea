version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: tea-db
    restart: unless-stopped
    environment:
      POSTGRES_DB:       teadb
      POSTGRES_USER:     teauser
      POSTGRES_PASSWORD: teapass123
    volumes:
      - tea_pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U teauser -d teadb"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    image: tea-auction-backend:latest
    container_name: tea-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT:        5000
      DB_HOST:     db
      DB_PORT:     5432
      DB_NAME:     teadb
      DB_USER:     teauser
      DB_PASSWORD: teapass123
      NODE_ENV:    production
      JWT_SECRET:  vedanta-tea-secret-2025
    volumes:
      - tea_uploads:/app/uploads

  frontend:
    image: tea-auction-frontend:latest
    container_name: tea-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  tea_pgdata:
  tea_uploads: